spring:
  application:
    name: api
  servlet:
    multipart:
      max-file-size: ${APP_STORAGE_S3_MAX_FILE_SIZE:5242880}
      max-request-size: ${APP_STORAGE_S3_MAX_REQUEST_SIZE:6291456}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  auth:
    token:
      secret: ${APP_AUTH_TOKEN_SECRET}
      access-token-expiration-seconds: ${APP_AUTH_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
      refresh-token-expiration-seconds: ${APP_AUTH_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  public-assets:
    base-url: ${APP_PUBLIC_ASSETS_BASE_URL:https://assets.zero-st.com}
  point:
    policy:
      max-cumulative-earn-amount-per-user: ${APP_POINT_POLICY_MAX_CUMULATIVE_EARN_AMOUNT_PER_USER:}
  storage:
    s3:
      bucket: ${APP_STORAGE_S3_BUCKET}
      region: ${APP_STORAGE_S3_REGION:ap-northeast-2}
      max-file-size: ${APP_STORAGE_S3_MAX_FILE_SIZE:5242880}
      presigned-url-duration-seconds: ${APP_STORAGE_S3_PRESIGNED_URL_DURATION_SECONDS:600}
