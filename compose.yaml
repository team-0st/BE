services:
  app-prod:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${PROD_IMAGE_TAG}
    container_name: zerost-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app-dev:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${DEV_IMAGE_TAG}
    container_name: zerost-dev
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
