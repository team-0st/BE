name: Deploy

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  APP_DIR: /opt/zerost

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Test and build
        run: ./gradlew test bootJar --no-daemon

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve deployment target
        id: target
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "image_tag=prod-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "env_file_secret=ENV_FILE_PROD" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "image_tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "env_file_secret=ENV_FILE_DEV" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.target.outputs.image_tag }}
        run: |
          docker build \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ steps.target.outputs.environment }}-latest" \
            .

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.target.outputs.image_tag }}
        run: |
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ steps.target.outputs.environment }}-latest"

      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/zerost_key.pem
          chmod 600 ~/.ssh/zerost_key.pem

      - name: Sync deployment files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/zerost_key.pem -o StrictHostKeyChecking=no "${EC2_USER}@${EC2_HOST}" "mkdir -p ${APP_DIR}/nginx"
          scp -i ~/.ssh/zerost_key.pem -o StrictHostKeyChecking=no compose.yaml "${EC2_USER}@${EC2_HOST}:${APP_DIR}/compose.yaml"
          scp -i ~/.ssh/zerost_key.pem -o StrictHostKeyChecking=no scripts/deploy.sh "${EC2_USER}@${EC2_HOST}:${APP_DIR}/deploy.sh"
          scp -i ~/.ssh/zerost_key.pem -o StrictHostKeyChecking=no nginx/prod.conf "${EC2_USER}@${EC2_HOST}:${APP_DIR}/nginx/prod.conf"
          scp -i ~/.ssh/zerost_key.pem -o StrictHostKeyChecking=no nginx/dev.conf "${EC2_USER}@${EC2_HOST}:${APP_DIR}/nginx/dev.conf"

      - name: Upload environment file
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          TARGET_ENV: ${{ steps.target.outputs.environment }}
          ENV_FILE_PROD: ${{ secrets.ENV_FILE_PROD }}
          ENV_FILE_DEV: ${{ secrets.ENV_FILE_DEV }}
        run: |
          if [[ "${TARGET_ENV}" == "prod" ]]; then
            ENV_FILE_CONTENT="${ENV_FILE_PROD}"
          else
            ENV_FILE_CONTENT="${ENV_FILE_DEV}"
          fi

          ssh -i ~/.ssh/zerost_key.pem -o StrictHostKeyChecking=no "${EC2_USER}@${EC2_HOST}" "cat > ${APP_DIR}/.env.${TARGET_ENV}" <<EOF
          ${ENV_FILE_CONTENT}
          EOF

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          TARGET_ENV: ${{ steps.target.outputs.environment }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.target.outputs.image_tag }}
        run: |
          ECR_PASSWORD="$(aws ecr get-login-password --region "${AWS_REGION}")"
          ssh -i ~/.ssh/zerost_key.pem -o StrictHostKeyChecking=no "${EC2_USER}@${EC2_HOST}" "chmod +x ${APP_DIR}/deploy.sh"
          ssh -i ~/.ssh/zerost_key.pem -o StrictHostKeyChecking=no "${EC2_USER}@${EC2_HOST}" "docker login --username AWS --password-stdin ${ECR_REGISTRY}" <<< "${ECR_PASSWORD}"
          ssh -i ~/.ssh/zerost_key.pem -o StrictHostKeyChecking=no "${EC2_USER}@${EC2_HOST}" "${APP_DIR}/deploy.sh ${TARGET_ENV} ${ECR_REGISTRY} ${ECR_REPOSITORY} ${IMAGE_TAG}"
