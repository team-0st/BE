name: Deploy Prod

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  APP_DIR: /opt/zerost

jobs:
  deploy-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Test and build
        run: ./gradlew test bootJar --no-daemon

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: prod-${{ github.sha }}
        run: |
          docker build \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:prod-latest" \
            .

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: prod-${{ github.sha }}
        run: |
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:prod-latest"

      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/zerost_key.pem
          chmod 600 ~/.ssh/zerost_key.pem

      - name: Sync deployment files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/zerost_key.pem -o StrictHostKeyChecking=no "${EC2_USER}@${EC2_HOST}" "mkdir -p ${APP_DIR}/nginx"
          scp -i ~/.ssh/zerost_key.pem -o StrictHostKeyChecking=no compose.yaml "${EC2_USER}@${EC2_HOST}:${APP_DIR}/compose.yaml"
          scp -i ~/.ssh/zerost_key.pem -o StrictHostKeyChecking=no scripts/deploy.sh "${EC2_USER}@${EC2_HOST}:${APP_DIR}/deploy.sh"
          scp -i ~/.ssh/zerost_key.pem -o StrictHostKeyChecking=no nginx/prod.conf "${EC2_USER}@${EC2_HOST}:${APP_DIR}/nginx/prod.conf"
          scp -i ~/.ssh/zerost_key.pem -o StrictHostKeyChecking=no nginx/dev.conf "${EC2_USER}@${EC2_HOST}:${APP_DIR}/nginx/dev.conf"

      - name: Upload prod environment file
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          ENV_FILE_PROD: ${{ secrets.ENV_FILE_PROD }}
        run: |
          ssh -i ~/.ssh/zerost_key.pem -o StrictHostKeyChecking=no "${EC2_USER}@${EC2_HOST}" "cat > ${APP_DIR}/.env.prod" <<EOF
          ${ENV_FILE_PROD}
          EOF

      - name: Deploy prod to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: prod-${{ github.sha }}
        run: |
          ECR_PASSWORD="$(aws ecr get-login-password --region "${AWS_REGION}")"
          ssh -i ~/.ssh/zerost_key.pem -o StrictHostKeyChecking=no "${EC2_USER}@${EC2_HOST}" "chmod +x ${APP_DIR}/deploy.sh"
          ssh -i ~/.ssh/zerost_key.pem -o StrictHostKeyChecking=no "${EC2_USER}@${EC2_HOST}" "docker login --username AWS --password-stdin ${ECR_REGISTRY}" <<< "${ECR_PASSWORD}"
          ssh -i ~/.ssh/zerost_key.pem -o StrictHostKeyChecking=no "${EC2_USER}@${EC2_HOST}" "${APP_DIR}/deploy.sh prod ${ECR_REGISTRY} ${ECR_REPOSITORY} ${IMAGE_TAG}"
